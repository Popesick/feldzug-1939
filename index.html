<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generalstab – Europa 1936</title>
  <style>
    :root {
      --bg: #1b1e22; --panel: #262a30; --raised: #30353c; --hover: #3a4049; --line: #3c424a; --soft: #32373e;
      --ink: #ece8dd; --dim: #9ea5ad; --ger: #8a947c; --pol: #c9a24b; --acc: #e0bd62; --bad: #e0705a; --ok: #7fb37a;
      --r: 7px; --shadow: 0 10px 34px #0009;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
    b { font-weight: 600; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #454c55; border-radius: 6px; border: 2px solid var(--panel); }
    ::-webkit-scrollbar-track { background: transparent; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

    /* Kopfzeile */
    header { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 7px 14px; background: linear-gradient(#2b3037, #24282e); border-bottom: 1px solid #14161a; box-shadow: 0 2px 10px #0006; position: relative; z-index: 2; }
    header h1 { font-size: 15px; margin: 0 4px 0 0; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 700; color: var(--acc); }
    header .sp { flex: 1; }
    .scen { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; padding-right: 12px; border-right: 1px solid var(--line); }
    #date { display: flex; align-items: baseline; gap: 8px; padding-right: 12px; border-right: 1px solid var(--line); white-space: nowrap; }
    #date b { font-size: 15px; }
    #date small, #vp small { font-size: 11px; color: var(--dim); }
    #vp { display: flex; gap: 6px; flex-wrap: wrap; }
    .stat { display: inline-flex; align-items: baseline; gap: 6px; background: #1d2025; border: 1px solid var(--soft); border-radius: 999px; padding: 2px 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stat i { font-style: normal; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
    .stat b { color: var(--ink); }
    .stat.gold b { color: var(--acc); }
    .stat.bad { border-color: var(--bad); }
    .stat.bad b, .stat.bad i { color: var(--bad); }
    #phase { font-size: 12.5px; }
    #phase .tag { display: inline-block; background: #4a3f1c; color: #f1d98e; border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
    .tools { display: flex; gap: 6px; }
    .alert { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 7px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; vertical-align: 1px; }

    main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
    #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    canvas[hidden] { display: none; }

    /* Seitenleiste */
    aside { background: var(--panel); border-left: 1px solid #14161a; overflow-y: auto; padding: 14px 14px 20px; }
    aside h2 { font-size: 18px; margin: 0 0 2px; font-weight: 650; }
    aside h3, #modal h3 { font-size: 11px; margin: 18px 0 7px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    aside h3::after, #modal h3::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    aside p { margin: 6px 0; }
    .dim { color: var(--dim); }
    .bad { color: var(--bad); }
    .tagline { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
    .tagline span { font-size: 12px; background: var(--raised); border-radius: 4px; padding: 1px 7px; color: #cfd3d8; }
    details.help { background: #21252a; border: 1px solid var(--soft); border-radius: var(--r); padding: 0 10px; margin: 10px 0 0; font-size: 13px; color: var(--dim); }
    details.help summary { cursor: pointer; padding: 7px 0; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 8px; }
    details.help summary::before { content: '?'; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--raised); font-size: 12px; color: var(--acc); }
    details.help summary::-webkit-details-marker { display: none; }
    details.help p { margin: 0 0 8px; }
    kbd { font: 11px ui-monospace, monospace; background: var(--raised); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }

    /* Bedienelemente */
    button { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid #474e57; border-radius: 6px; padding: 4px 11px; cursor: pointer; transition: background .12s, border-color .12s, transform .05s; }
    button:hover:not(:disabled) { background: var(--hover); border-color: #5b636e; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: linear-gradient(#a8892f, #8a6f24); border-color: #c4a544; color: #fffbe9; font-weight: 600; text-shadow: 0 1px 0 #0005; }
    button.primary:hover:not(:disabled) { background: linear-gradient(#b99835, #987a28); border-color: #d9ba55; }
    button.on { background: #3a4f66; border-color: #6f9cc8; }
    select { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid #474e57; border-radius: 6px; padding: 3px 8px; }
    input[type=range] { accent-color: var(--acc); height: 18px; cursor: pointer; }
    input[type=checkbox] { accent-color: var(--acc); width: 15px; height: 15px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 7px 0; }
    aside .row button { font-size: 13px; padding: 3px 9px; }

    /* Karten: Verbände, Linien, Menü */
    .div { background: var(--raised); border: 1px solid var(--soft); border-left: 4px solid var(--ger); border-radius: var(--r); padding: 7px 9px; margin: 6px 0; }
    .div.POL { border-left-color: var(--pol); }
    .div label { display: flex; gap: 7px; align-items: center; font-weight: 600; }
    .div .meta { font-size: 12px; color: var(--dim); margin-top: 1px; }
    .div .str { height: 4px; background: #1c1f23; border-radius: 2px; margin: 5px 0 2px; overflow: hidden; }
    .div .str i { display: block; height: 100%; border-radius: 2px; background: var(--ok); }
    .div .str i.mid { background: var(--acc); }
    .div .str i.low { background: var(--bad); }
    .meta { font-size: 12px; color: var(--dim); }
    .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .chip { font: 11px ui-monospace, monospace; background: #22262b; border: 1px solid var(--soft); border-radius: 4px; padding: 0 5px; color: #cfd3d8; }
    .chip.low { color: #f3a591; border-color: #6b3a31; }
    #log, .blog { font-size: 12px; color: var(--dim); }
    #log div, .blog div { padding: 3px 0 3px 9px; border-left: 2px solid var(--line); margin: 2px 0; }
    #log div:first-child, .blog div:first-child { color: var(--ink); border-left-color: var(--acc); }
    .bar { height: 8px; background: #181a1e; border-radius: 4px; overflow: hidden; margin: 3px 0 7px; position: relative; }
    .bar i { display: block; height: 100%; border-radius: 4px; }
    .bar u { position: absolute; left: 35%; top: 0; bottom: 0; width: 1px; background: #fff8; }
    .air { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-variant-numeric: tabular-nums; }
    .air span:first-child { width: 52px; }
    .air input { flex: 1; min-width: 80px; }
    .air b { min-width: 18px; text-align: right; color: var(--acc); }

    /* Fenster */
    #modal { position: fixed; inset: 0; background: #0b0d10cc; backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 10; }
    #modal[hidden] { display: none; }
    #modal .box { background: var(--panel); border: 1px solid #4a515a; border-radius: 10px; padding: 20px 24px; width: min(640px, 92vw); max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow); animation: pop .14s ease-out; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } }
    #modal h2 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
    #modal p { margin: 8px 0; }
    #modal .box > .row:last-child { margin: 16px 0 0; justify-content: flex-end; }
    #modal .box > .row:last-child button { padding: 6px 16px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 12px; }
    #modal .box.wide { width: min(1000px, 96vw); padding-top: 0; }
    .tabs { display: flex; gap: 2px; align-items: flex-end; margin: 0 -24px 14px; padding: 12px 24px 0; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; }
    .tabs .sp { flex: 1; }
    .tabs button[data-tab] { border: 0; border-radius: 6px 6px 0 0; background: transparent; padding: 7px 15px; color: var(--dim); border-bottom: 2px solid transparent; }
    .tabs button[data-tab]:hover { color: var(--ink); background: var(--raised); }
    .tabs button[data-tab].on { color: var(--acc); border-bottom-color: var(--acc); background: transparent; font-weight: 600; }
    .tabs > span.dim, .tabs button[data-close] { margin-bottom: 7px; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .stats > span { background: #1d2025; border: 1px solid var(--soft); border-radius: var(--r); padding: 4px 11px; }
    .stats b { color: var(--acc); }
    .line { background: var(--raised); border: 1px solid var(--soft); border-left: 4px solid var(--ger); border-radius: var(--r); padding: 8px 11px; margin: 7px 0; display: grid; gap: 4px; }
    .line.off { opacity: .55; border-left-color: var(--line); background: transparent; }
    .line.new { border-left-color: var(--bad); }
    .line input[type=range] { width: 190px; vertical-align: middle; }
    input.ships { width: 64px; font: inherit; color: var(--ink); background: #1d2025; border: 1px solid #474e57; border-radius: 6px; padding: 3px 6px; }
    input.ships:disabled { opacity: .35; }
    table.fleet td { text-align: center; }
    table.fleet td:first-child { text-align: left; }
    .lock { padding: 1px 8px; font-size: 12px; margin-left: 4px; }
    .lock.on { background: #4a3f1c; border-color: var(--acc); color: #f1d98e; }
    .num { display: inline-block; min-width: 108px; color: var(--acc); font-weight: 600; font-variant-numeric: tabular-nums; }
    #modal table { border-collapse: collapse; width: 100%; }
    #modal td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--soft); vertical-align: top; }
    #modal tr:hover td { background: #2b3036; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0006; vertical-align: -1px; }
    #modal .box.title { width: min(860px, 94vw); padding: 0 0 16px; overflow-x: hidden; }
    #modal .box.title > :not(.cover) { margin-left: 22px; margin-right: 22px; }
    .cover { display: block; width: 100%; aspect-ratio: 1672 / 760; object-fit: cover; object-position: top; border-radius: 10px 10px 0 0; border-bottom: 1px solid #14161a; }
    .slot { display: flex; align-items: center; gap: 10px; background: var(--raised); border: 1px solid var(--soft); border-radius: var(--r); padding: 8px 11px; margin: 7px 0; }
    .slot .sp { flex: 1; }
    .slot b { display: block; }
    .menu h2 { font-size: 26px !important; letter-spacing: 3px; text-transform: uppercase; color: var(--acc); margin-bottom: 2px !important; }
    .menu-card { background: var(--raised); border: 1px solid var(--soft); border-left: 4px solid var(--acc); border-radius: var(--r); padding: 12px 14px; margin: 12px 0; transition: border-color .12s; }
    .menu-card:hover { border-color: #5b636e; border-left-color: var(--acc); }
    .menu-card h3 { margin: 0 0 4px !important; font-size: 16px !important; color: var(--ink) !important; text-transform: none !important; letter-spacing: 0 !important; }
    .menu-card h3::after { display: none; }
    .menu-card p { margin: 4px 0 8px !important; font-size: 13px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr 300px; } #date { border: 0; padding: 0; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Generalstab</h1>
      <span id="title" class="scen"></span>
      <span id="date"></span>
      <span id="vp"></span>
      <span class="sp"></span>
      <span id="phase" class="dim"></span>
      <div class="tools">
        <button id="btnEco" hidden>Reich verwalten</button>
        <button id="btnView">Luftansicht</button>
        <button id="btnSave" title="Eigenen Spielstand anlegen">Speichern</button>
        <button id="btnLoad" title="Eigenen Spielstand laden">Laden</button>
        <button id="btnMenu">Menü</button>
        <button id="btnEnd" class="primary">Runde beenden ⏎</button>
      </div>
    </header>
    <main>
      <div id="stage">
        <canvas id="map"></canvas>
        <canvas id="battle" hidden></canvas>
      </div>
      <aside id="side"></aside>
    </main>
  </div>
  <div id="modal" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
